# Fica inativo enquanto o portal estiver dentro do repositório da landing
# (o GitHub só lê .github/ na raiz). Passa a funcionar quando a pasta portal/
# virar a raiz do repositório próprio.
#
# Gera o portal (npm run build) e publica o conteúdo de dist/ na branch `deploy`.
# No hPanel, o Git do subdomínio deve puxar a branch `deploy`.
name: Build e deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publicar dist/ na branch deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
